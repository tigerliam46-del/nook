# Fly.io settings for Nook. Nook must run as ONE machine (its data lives in one SQLite file).
app = "nook-change-liam"
primary_region = "lhr"

[env]
  PORT = "3000"
  TRUST_PROXY = "1"
  BACKUP_DIR = "/app/data/backups"

[[mounts]]
  source = "nook_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
