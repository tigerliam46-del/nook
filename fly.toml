# fly.toml app configuration file generated for nook-vht9dq on 2026-10-13T21:29:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nook-vht9dq'
primary_region = 'ams'

[build]

[env]
  BACKUP_DIR = '/app/data/backups'
  PORT = '3000'
  TRUST_PROXY = '1'

[[mounts]]
  source = 'nook_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
